<div style="display: flex; flex-direction: column;">
  <mat-form-field class="example-form-field" appearance="fill">
    <mat-label>Title Input</mat-label>
    <input matInput type="text" [(ngModel)]="titleInput" (input)="onTitleInput($event)" [disabled]="isDisabled" />
  </mat-form-field>

  <mat-form-field class="example-form-field" appearance="fill">
    <mat-label>Subtitle Input</mat-label>
    <input matInput type="text" [(ngModel)]="subtitleInput" (input)="onSubtitleInput($event)" [disabled]="isDisabled" />
  </mat-form-field>
</div>
